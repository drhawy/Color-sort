<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>رتّب الألوان</title>
<meta name="theme-color" content="#131931">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E9F5; --bg2:#D5DAF0; --ink:#1D2342; --muted:#5B6386;
  --glass:rgba(255,255,255,.55); --edge:rgba(29,35,66,.28);
  --btn:#FFFFFF; --btn-ink:#1D2342; --accent:#5B47E0; --hidden:#4A4F6E;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131931; --bg2:#1C2447; --ink:#EEF0FA; --muted:#9BA3C7;
    --glass:rgba(255,255,255,.07); --edge:rgba(220,226,255,.32);
    --btn:#252E55; --btn-ink:#EEF0FA; --accent:#9A8AFF; --hidden:#3A4066;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131931; --bg2:#1C2447; --ink:#EEF0FA; --muted:#9BA3C7;
  --glass:rgba(255,255,255,.07); --edge:rgba(220,226,255,.32);
  --btn:#252E55; --btn-ink:#EEF0FA; --accent:#9A8AFF; --hidden:#3A4066;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 70%);
  background-color:var(--bg);
  color:var(--ink);
  font-family:"Baloo Bhaijaan 2",system-ui,Tahoma,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  overflow:hidden;touch-action:manipulation;
}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 0}
.lvl{font-weight:800;font-size:1.6rem;line-height:1}
.lvl small{display:block;font-weight:500;font-size:.85rem;color:var(--muted);margin-top:4px}
.moves{font-size:.95rem;color:var(--muted);text-align:left}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:calc(var(--sh,40px)*.9);padding:24px 12px 8px}
.row{display:flex;justify-content:center;gap:var(--gap,12px)}
.slot{position:relative;padding-top:12px;cursor:pointer;transition:transform .18s cubic-bezier(.3,.7,.4,1.4)}
.slot.sel{transform:translateY(-20px)}
.slot.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.tube{
  width:var(--tw,48px);height:calc(var(--sh,40px)*4 + 10px);
  border:2.5px solid var(--edge);border-top:none;
  border-radius:0 0 calc(var(--tw,48px)/2) calc(var(--tw,48px)/2);
  background:var(--glass);overflow:hidden;
  display:flex;flex-direction:column-reverse;position:relative;
}
.tube::after{content:"";position:absolute;inset:0 auto 0 18%;width:12%;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.08));border-radius:8px;pointer-events:none}
.rim{position:absolute;top:8px;left:-5px;right:-5px;height:6px;border-radius:4px;background:var(--edge)}
.seg{height:var(--sh,40px);flex:none;position:relative;transform-origin:bottom}
.seg.new{animation:fill .28s ease-out}
@keyframes fill{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.seg.hid{background:var(--hidden)!important;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-weight:800;font-size:calc(var(--sh,40px)*.5)}
.seg.reveal{animation:rev .35s ease-out}
@keyframes rev{from{filter:brightness(2.2)}to{filter:none}}
.cap{position:absolute;top:0;left:50%;width:calc(var(--tw,48px)*.72);height:14px;margin-left:calc(var(--tw,48px)*-.36);border-radius:6px 6px 3px 3px;background:#B4875A;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);transform:scale(0);transition:transform .3s cubic-bezier(.3,.7,.4,1.6);z-index:2}
.slot.done .cap{transform:scale(1)}
footer{display:flex;justify-content:center;gap:12px;padding:10px 16px 18px}
button{
  font:inherit;font-weight:700;font-size:1rem;color:var(--btn-ink);background:var(--btn);
  border:none;border-radius:16px;padding:10px 14px;min-width:84px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 3px 0 var(--edge);cursor:pointer;
}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
button:disabled{opacity:.4}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button svg{width:24px;height:24px}
.stream{position:fixed;z-index:9;border-radius:4px;pointer-events:none;box-shadow:inset 2px 0 0 rgba(255,255,255,.3)}
.hright{display:flex;align-items:center;gap:10px}
button.snd{min-width:0;padding:6px 10px;border-radius:12px;font-size:1.1rem;box-shadow:0 2px 0 var(--edge)}
.lvcard{max-width:380px}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-height:55vh;overflow-y:auto;padding:6px 4px;margin:14px 0 18px}
.lvgrid button.lv{min-width:0;width:auto;padding:0;aspect-ratio:1;border-radius:14px;background:var(--bg2);color:var(--ink);font-size:1.2rem;font-weight:800;box-shadow:0 3px 0 var(--edge);position:relative;justify-content:center}
.lvgrid button.lv.cur{background:var(--accent);color:#fff}
.lvgrid button.lv.done::after{content:"✓";position:absolute;top:3px;left:7px;font-size:.75rem;color:#2FA36B}
.lvgrid button.lv.cur.done::after{color:#fff}
.lvgrid button.lv.lock{opacity:.4;box-shadow:none}
.lvgrid button.lv.lock::after{content:"🔒";position:absolute;bottom:2px;font-size:.6rem}
.lvl{cursor:pointer}
.card button.alt{background:var(--bg2);color:var(--ink);margin-top:10px}
.card .warn{font-size:2.6rem;line-height:1;margin-bottom:6px}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,30,.55);z-index:20;padding:24px}
.overlay.show{display:flex}
.card{background:var(--btn);color:var(--ink);border-radius:28px;padding:28px 26px;text-align:center;max-width:320px;width:100%;animation:pop .35s cubic-bezier(.3,.7,.4,1.4)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card h2{margin:0;font-size:2rem;font-weight:800}
.card p{margin:6px 0 20px;color:var(--muted)}
.card button{width:100%;background:var(--accent);color:#fff;box-shadow:none;font-size:1.2rem;padding:12px}
.tag{display:inline-block;font-size:.8rem;color:var(--accent);font-weight:700}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="lvl" id="lvl">المستوى 1<small id="info"></small></div>
  <div class="hright"><div class="moves" id="moves">0 حركة</div><button id="lvlBtn" class="snd" aria-label="اختيار المستوى"><svg viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></button><button id="snd" class="snd" aria-label="الصوت">🔊</button></div>
</header>
<main id="board"></main>
<footer>
  <button id="undo" aria-label="تراجع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h2"/></svg>تراجع</button>
  <button id="restart" aria-label="إعادة المستوى"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>إعادة</button>
  <button id="extra" aria-label="أنبوبة إضافية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>أنبوبة</button>
</footer>
<div class="overlay" id="levels"><div class="card lvcard">
  <h2>المستويات</h2>
  <div class="lvgrid" id="lvgrid"></div>
  <button id="lvClose">رجوع للعب</button>
</div></div>
<div class="overlay" id="stuck"><div class="card">
  <div class="warn">⚠️</div>
  <h2>طريق مسدود</h2>
  <p id="stuckText"></p>
  <button id="stuckExtra">أضف أنبوبة وكمّل</button>
  <button id="stuckRestart" class="alt">إعادة المستوى</button>
</div></div>
<div class="overlay" id="win"><div class="card">
  <h2>أحسنت!</h2>
  <p id="winText"></p>
  <button id="next">المستوى التالي</button>
</div></div>

<script>
(function(){
const CAP=4;
const COLORS=["#E5484D","#F28C28","#F5D90A","#8BD94A","#2FA36B","#1FC5C1","#3BA3F5","#3E5BDB","#8E4EC6","#F06BB5","#8D5A3B","#C9CED8"];
let level=1,tubes=[],initial=[],history=[],sel=-1,moves=0,extraUsed=false,hiddenLevel=false,active=0;
let slotEls=[],inFlight=new Set(),receiving=[],pourDir={};

try{const v=parseInt(localStorage.getItem("cs_level"),10);if(v>0)level=v}catch(e){}
let maxLevel=level;
try{const m=parseInt(localStorage.getItem("cs_max"),10);if(m>maxLevel)maxLevel=m}catch(e){}
function saveLevel(){try{localStorage.setItem("cs_level",String(level));localStorage.setItem("cs_max",String(maxLevel))}catch(e){}}

function rng(seed){return function(){seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- rules on plain color arrays (used by solver) ---------- */
const topC=t=>t[t.length-1];
function run(t){if(!t.length)return 0;const c=topC(t);let n=0;for(let i=t.length-1;i>=0&&t[i]===c;i--)n++;return n}
const complete=t=>t.length===CAP&&run(t)===CAP;
const won=s=>s.every(t=>t.length===0||complete(t));
function canPour(s,a,b){return a!==b&&s[a].length>0&&s[b].length<CAP&&(s[b].length===0||topC(s[b])===topC(s[a]))}

function solvable(start){
  const seen=new Set(),stack=[start];let nodes=0;
  const key=s=>s.map(t=>t.join(",")).sort().join("|");
  seen.add(key(start));
  while(stack.length){
    const s=stack.pop();
    if(won(s))return true;
    if(++nodes>40000)return false;
    for(let a=0;a<s.length;a++){
      const A=s[a];if(!A.length||complete(A))continue;
      const r=run(A);
      for(let b=0;b<s.length;b++){
        if(!canPour(s,a,b))continue;
        if(s[b].length===0&&r===A.length)continue; // pointless move
        const ns=s.map(t=>t.slice());
        const n=Math.min(r,CAP-ns[b].length);
        for(let k=0;k<n;k++)ns[b].push(ns[a].pop());
        const kk=key(ns);
        if(!seen.has(kk)){seen.add(kk);stack.push(ns)}
      }
    }
  }
  return false;
}

function generate(lv){
  const nc=Math.min(3+Math.floor((lv-1)/2),COLORS.length);
  let last=null;
  for(let a=0;a<60;a++){
    const r=rng(lv*7919+a*104729+13);
    const pool=[];for(let c=0;c<nc;c++)for(let k=0;k<CAP;k++)pool.push(c);
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    const s=[];for(let i=0;i<nc;i++)s.push(pool.slice(i*CAP,i*CAP+CAP));
    s.push([],[]);
    last=s;
    if(s.some(complete))continue;
    if(s.some(t=>t.length&&run(t)>=3))continue; // avoid near-solved tubes
    if(solvable(s))return s;
  }
  return last;
}

/* ---------- game state: tubes of {c,h} ---------- */
const colorsOf=()=>tubes.map(t=>t.map(x=>x.c));
const clone=s=>s.map(t=>t.map(x=>({c:x.c,h:x.h})));

function startLevel(lv){
  hiddenLevel=lv>=6&&lv%3===0;
  const s=generate(lv);
  initial=s.map(t=>t.map((c,i)=>({c,h:hiddenLevel&&i<t.length-1})));
  reset();
}
function reset(){
  tubes=clone(initial);history=[];sel=-1;moves=0;extraUsed=false;
  render();
}

function revealTops(){
  const revealed=[];
  tubes.forEach((t,i)=>{if(t.length&&t[t.length-1].h){t[t.length-1].h=false;revealed.push(i)}});
  return revealed;
}

function canSrc(k,cs){return tubes[k].length>0&&!complete(cs[k])&&!inFlight.has(k)&&!receiving[k]}
function tap(i){
  ac();
  if(inFlight.has(i))return;                 // that bottle is in the air right now
  const cs=colorsOf();
  if(sel===-1){
    if(canSrc(i,cs)){sel=i;updateSel()}
    else if(!receiving[i])shake(i);
    return;
  }
  if(sel===i){sel=-1;updateSel();return}
  if(canPour(cs,sel,i)){
    doPour(sel,i);
  }else if(canSrc(i,cs)){
    sel=i;updateSel();
  }else{
    shake(i);
  }
}

/* ---------- sound (Web Audio, generated live) ---------- */
let soundOn=true;try{if(localStorage.getItem("cs_sound")==="0")soundOn=false}catch(e){}
let actx=null,noiseBuf=null;
function ac(){
  if(!soundOn)return null;
  try{
    if(!actx){
      actx=new (window.AudioContext||window.webkitAudioContext)();
      const len=actx.sampleRate*2;noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let k=0;k<len;k++)d[k]=Math.random()*2-1;
    }
    loadSfx(actx);
    if(actx.state==="suspended")actx.resume();
    return actx;
  }catch(e){return null}
}
function env(g,t,peak,dur,att,rel){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.setValueAtTime(peak,t+Math.max(att,dur-rel));g.gain.linearRampToValueAtTime(0.0001,t+dur)}
function noiseSrc(c){const s=c.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.loopStart=Math.random();return s}

  const buf=c.createBuffer(1,data.length,c.sampleRate);buf.getChannelData(0).set(data);
  const s=c.createBufferSource(),g=c.createGain();g.gain.value=0.75;
  s.buffer=buf;s.connect(g);g.connect(c.destination);s.start(Math.max(c.currentTime+0.005,t0+(delay||0)));
}
function tone(f,t,d,v,type){const c=actx;const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.02)}
function chime(){const c=ac();if(!c)return;const t=c.currentTime;tone(1046,t,0.35,0.12);tone(1568,t+0.08,0.45,0.1)}
function winSound(){const c=ac();if(!c)return;const t=c.currentTime;[523,659,784,1046].forEach((f,k)=>tone(f,t+k*0.11,0.5,0.12,"triangle"))}

/* ---------- pour animation: a flying copy of the bottle does the pouring, so the
   game state is committed at once and other bottles stay playable meanwhile ---------- */
function doPour(a,b){
  const cs=colorsOf();
  const n=Math.min(run(cs[a]),CAP-tubes[b].length);
  const startLen=tubes[b].length;
  const color=COLORS[cs[a][cs[a].length-1]];
  history.push({tubes:clone(tubes),moves,extra:extraUsed});
  const board=document.getElementById("board");
  const sA=slotEls[a],sB=slotEls[b];
  const tB=sB.querySelector(".tube");
  const rS=sA.getBoundingClientRect(),rA=sA.querySelector(".tube").getBoundingClientRect(),rB=tB.getBoundingClientRect();
  const lifted=sA.classList.contains("sel")?20:0;
  // flying copy, showing the bottle as it was before the pour
  const fly=sA.cloneNode(true);
  fly.classList.remove("sel","shake");
  Object.assign(fly.style,{position:"fixed",left:rS.left+"px",top:rS.top+"px",width:rS.width+"px",margin:"0",zIndex:"10",pointerEvents:"none",transform:"none"});
  board.appendChild(fly);
  // commit the move right away
  for(let k=0;k<n;k++)tubes[b].push(tubes[a].pop());
  moves++;
  const revealed=revealTops();
  const destBusy=receiving[b]>0;
  sel=-1;active++;inFlight.add(a);receiving[b]++;
  sA.classList.remove("sel");sA.style.visibility="hidden";
  fillTube(a);updateSel();updateHud();
  // geometry: mouth corner over the target, tilted mouth-down
  const w=rA.width,h=rA.height;
  const cx0=rA.left+w/2,cy0=rA.top+h/2;
  const bx=rB.left+rB.width/2;
  let dir=bx>=cx0?1:-1;
  if(destBusy)dir=-(pourDir[b]||dir);        // second bottle pours from the other side
  pourDir[b]=dir;
  const P={x:bx,y:rB.top-6};
  const safeTop=(parseFloat(getComputedStyle(document.documentElement).paddingTop)||0)+4;
  let pick=null;
  for(const deg of [130,118,105,95]){
    const th=dir*deg*Math.PI/180,co=Math.cos(th),si=Math.sin(th);
    const ax=dir*w/2,ay=-h/2;
    const C={x:P.x-(ax*co-ay*si),y:P.y-(ax*si+ay*co)};
    let minY=Infinity;
    for(const [x,y] of [[-w/2,-h/2],[w/2,-h/2],[-w/2,h/2],[w/2,h/2]])minY=Math.min(minY,C.y+x*si+y*co);
    pick={C,deg:dir*deg};
    if(minY>=safeTop)break;
  }
  const sh=parseFloat(getComputedStyle(board).getPropertyValue("--sh"))||40;
  fly.style.transformOrigin="50% "+(12+h/2)+"px";
  void fly.offsetWidth;
  fly.style.transition="transform .42s cubic-bezier(.45,0,.25,1)";
  fly.style.transform="translate("+(pick.C.x-cx0)+"px,"+(pick.C.y-cy0)+"px) rotate("+pick.deg+"deg)";
  const dur=0.25+0.17*n;
  pourSound(dur+0.08,startLen,startLen+n,0.43);
  setTimeout(()=>{
    const st=document.createElement("div");st.className="stream";
    const sw=Math.max(5,Math.round(w*0.16));
    const bottom=rB.bottom-3;
    const y0=bottom-startLen*sh,y1=bottom-(startLen+n)*sh;
    Object.assign(st.style,{left:(P.x-sw/2)+"px",top:P.y+"px",width:sw+"px",height:"0px",background:color});
    document.body.appendChild(st);
    requestAnimationFrame(()=>{
      st.style.transition="height .08s linear";st.style.height=Math.max(0,y0-P.y)+"px";
      setTimeout(()=>{st.style.transition="height "+dur+"s linear";st.style.height=Math.max(0,y1-P.y)+"px"},90);
    });
    [...fly.querySelector(".tube").children].slice(-n).forEach(x=>{x.style.transition="height "+dur+"s linear";x.style.height="0px"});
    const added=[];
    for(let k=0;k<n;k++){
      const x=document.createElement("div");x.className="seg";x.style.background=color;x.style.height="0px";
      x.style.transition="height "+(dur/n)+"s linear "+(0.08+k*dur/n)+"s";
      tB.appendChild(x);added.push(x);
    }
    requestAnimationFrame(()=>requestAnimationFrame(()=>added.forEach(x=>x.style.height=sh+"px")));
    vibrate(12);
    setTimeout(()=>{
      st.style.transition="opacity .12s";st.style.opacity="0";setTimeout(()=>st.remove(),150);
      // target bottle is settled: it can be used again immediately
      receiving[b]--;
      if(!receiving[b]){fillTube(b);if(complete(colorsOf()[b])){vibrate([20,40,20]);chime()}}
      fly.style.transform="translate(0px,"+lifted+"px)";
      setTimeout(()=>{
        fly.remove();sA.style.visibility="";
        inFlight.delete(a);active--;
        fillTube(a,{reveal:revealed.includes(a)});
        updateHud();
        if(!active){if(won(colorsOf()))setTimeout(win,300);else if(noMoves())setTimeout(showStuck,350)}
      },430);
    },(dur+0.1)*1000);
  },430);
}

function shake(i){
  const el=slotEls[i];if(!el)return;
  el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");
  vibrate(30);
}
function vibrate(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

function layout(){
  const n=tubes.length;
  const rows=n<=6?1:(n<=14?2:3);
  const per=Math.ceil(n/rows);
  const vw=window.innerWidth||document.documentElement.clientWidth||360;
  const vh=window.innerHeight||document.documentElement.clientHeight||700;
  const W=Math.min(vw,620)-24;
  const gap=Math.max(8,Math.min(16,Math.floor(W/per*0.22)));
  let tw=Math.max(28,Math.min(58,Math.floor((W-gap*(per-1))/per)));
  const H=Math.max(300,vh-210);
  let sh=Math.min(Math.round(tw*0.82),46);
  const maxSh=Math.floor((H/rows-60)/4);
  if(sh>maxSh){sh=Math.max(20,maxSh)}
  const b=document.getElementById("board");
  b.style.setProperty("--tw",tw+"px");b.style.setProperty("--sh",sh+"px");b.style.setProperty("--gap",gap+"px");
  return {rows,per};
}

function fillTube(i,fx){
  const slot=slotEls[i];if(!slot)return;
  const tube=slot.querySelector(".tube");tube.innerHTML="";
  const t=tubes[i];
  t.forEach((x,j)=>{
    const s=document.createElement("div");s.className="seg";
    if(x.h){s.classList.add("hid");s.textContent="؟"}
    else s.style.background=COLORS[x.c];
    if(fx&&fx.reveal&&j===t.length-1)s.classList.add("reveal");
    tube.appendChild(s);
  });
  slot.classList.toggle("done",complete(t.map(x=>x.c)));
}
function updateSel(){slotEls.forEach((el,i)=>el.classList.toggle("sel",i===sel))}
function updateHud(){
  document.getElementById("lvl").firstChild.textContent="المستوى "+level;
  const nc=initial.filter(t=>t.length).length;
  document.getElementById("info").innerHTML=nc+" ألوان"+(hiddenLevel?' <span class="tag">· مستوى غامض</span>':"");
  document.getElementById("moves").textContent=moves+" حركة";
  document.getElementById("undo").disabled=history.length===0||active>0;
  document.getElementById("extra").disabled=extraUsed||active>0;
}
function render(){
  const b=document.getElementById("board");b.innerHTML="";
  const {rows,per}=layout();
  slotEls=[];inFlight.clear();receiving=tubes.map(()=>0);
  let idx=0;
  for(let r=0;r<rows;r++){
    const row=document.createElement("div");row.className="row";
    for(let k=0;k<per&&idx<tubes.length;k++,idx++){
      const i=idx;
      const slot=document.createElement("div");slot.className="slot";
      slot.setAttribute("role","button");slot.setAttribute("aria-label","أنبوبة "+(i+1));
      slot.innerHTML='<div class="cap"></div><div class="rim"></div><div class="tube"></div>';
      slot.addEventListener("click",()=>tap(i));
      row.appendChild(slot);slotEls.push(slot);
      fillTube(i);
    }
    b.appendChild(row);
  }
  updateSel();updateHud();
}

function win(){
  winSound();
  document.getElementById("winText").textContent="خلّصت المستوى "+level+" في "+moves+" حركة";
  document.getElementById("win").classList.add("show");
}

document.getElementById("undo").onclick=()=>{
  if(active)return;const h=history.pop();if(!h)return;
  tubes=h.tubes;moves=h.moves;extraUsed=h.extra;sel=-1;render();
};
document.getElementById("restart").onclick=()=>{if(!active)reset()};
document.getElementById("extra").onclick=()=>{
  if(extraUsed||active)return;
  history.push({tubes:clone(tubes),moves,extra:extraUsed});
  tubes.push([]);extraUsed=true;sel=-1;render();
};
document.getElementById("next").onclick=()=>{
  document.getElementById("win").classList.remove("show");
  level++;if(level>maxLevel)maxLevel=level;saveLevel();startLevel(level);
};
/* ---------- level picker: replay any passed level, next ones stay locked ---------- */
function openLevels(){
  if(active)return;
  const g=document.getElementById("lvgrid");g.innerHTML="";
  const total=Math.ceil((maxLevel+10)/5)*5;
  let curEl=null;
  for(let n=1;n<=total;n++){
    const b=document.createElement("button");
    b.className="lv"+(n===level?" cur":"")+(n<maxLevel?" done":"")+(n>maxLevel?" lock":"");
    b.textContent=n;
    if(n<=maxLevel){
      b.setAttribute("aria-label","المستوى "+n);
      b.onclick=()=>{closeLevels();if(n!==level){level=n;saveLevel();startLevel(level)}};
    }else{
      b.disabled=true;b.setAttribute("aria-label","المستوى "+n+" مقفول");
    }
    if(n===level)curEl=b;
    g.appendChild(b);
  }
  document.getElementById("levels").classList.add("show");
  if(curEl)curEl.scrollIntoView({block:"center"});
}
function closeLevels(){document.getElementById("levels").classList.remove("show")}
document.getElementById("lvlBtn").onclick=openLevels;
document.getElementById("lvl").onclick=openLevels;
document.getElementById("lvClose").onclick=closeLevels;
/* ---------- dead end: no move left, or the only moves just shuffle colors back and forth ---------- */
function usefulMoves(s){
  const out=[];
  for(let a=0;a<s.length;a++){
    if(!s[a].length||complete(s[a]))continue;
    const whole=run(s[a])===s[a].length;
    for(let b=0;b<s.length;b++){
      if(!canPour(s,a,b))continue;
      if(!s[b].length&&whole)continue;      // moving a one-color bottle into an empty one changes nothing
      out.push([a,b]);
    }
  }
  return out;
}
function noMoves(){
  // explore every position reachable from here; if it is a small closed loop with no win in it, the player is stuck
  const start=colorsOf(),key=s=>s.map(t=>t.join(",")).join("|");
  const seen=new Set([key(start)]),q=[start];
  while(q.length){
    const s=q.pop();
    if(won(s))return false;
    for(const [a,b] of usefulMoves(s)){
      const ns=s.map(t=>t.slice());
      const n=Math.min(run(ns[a]),CAP-ns[b].length);
      for(let k=0;k<n;k++)ns[b].push(ns[a].pop());
      const k2=key(ns);
      if(!seen.has(k2)){
        if(seen.size>=40)return false;     // plenty of real play left
        seen.add(k2);q.push(ns);
      }
    }
  }
  return true;
}
function showStuck(){
  if(active||won(colorsOf())||!noMoves())return;
  vibrate([40,60,40]);
  const shuffle=usefulMoves(colorsOf()).length>0;
  document.getElementById("stuckText").textContent=(shuffle?"الحركات الباقية بتنقل الألوان رايح جاي من غير فايدة. ":"")+(extraUsed
    ?"استخدمت الأنبوبة الإضافية بالفعل، فلازم تبدأ المستوى من الأول."
    :"تقدر تضيف أنبوبة فاضية وتكمّل، أو تبدأ المستوى من الأول.");
  document.getElementById("stuckExtra").style.display=extraUsed?"none":"";
  document.getElementById("stuck").classList.add("show");
}
function hideStuck(){document.getElementById("stuck").classList.remove("show")}
document.getElementById("stuckExtra").onclick=()=>{hideStuck();document.getElementById("extra").onclick()};
document.getElementById("stuckRestart").onclick=()=>{hideStuck();reset()};
document.getElementById("levels").onclick=e=>{if(e.target.id==="levels")closeLevels()};
window.addEventListener("resize",()=>{if(!active)render()});
const sndBtn=document.getElementById("snd");
const setSnd=()=>{sndBtn.textContent=soundOn?"🔊":"🔇"};setSnd();
sndBtn.onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("cs_sound",soundOn?"1":"0")}catch(e){}setSnd();if(soundOn)ac()};

try{startLevel(level)}catch(err){document.getElementById("board").textContent="حصل خطأ: "+err.message}
})();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
