name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['android-app.zip']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o android-app.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: src/android
        run: gradle assembleRelease --no-daemon
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/android/app/build/outputs/apk/release/app-release.apk ColorSort.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk ColorSort.apk --title "ColorSort APK" --notes "Built automatically"
